# Release — a version tag publishes the dual channels from one build
# (documented in docs/user-guide.md): the OCI artifact to ghcr.io/cur8s/flux:<version> and the
# rendered install manifest as the GitHub release asset install.yaml.
# Publication is gated on a green e2e for the tagged commit, as documented
# in docs/architecture.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release + asset
  packages: write # push the OCI artifact to ghcr.io

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2

      - name: Tag must match package version
        run: |
          source scripts/lib/version.sh
          load_flux_version version.env
          test "${GITHUB_REF_NAME}" = "${CUR8S_FLUX_VERSION}" || {
            echo "tag ${GITHUB_REF_NAME} != package version ${CUR8S_FLUX_VERSION}" >&2
            exit 1
          }

      - name: Publication gate — e2e
        run: mise run test:e2e

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI artifact
        run: mise run release

      - name: Publish GitHub release + install.yaml asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp oci/flux/deploy/flux.yaml install.yaml
          gh release create "${GITHUB_REF_NAME}" install.yaml \
            --title "flux ${GITHUB_REF_NAME}" \
            --notes "Opinionated Flux ${GITHUB_REF_NAME}. Artifact: oci://ghcr.io/cur8s/flux:${GITHUB_REF_NAME} — first touch: kubectl apply --server-side -f https://github.com/cur8s/flux/releases/download/${GITHUB_REF_NAME}/install.yaml."
