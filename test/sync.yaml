# ─────────────────────────────────────────────────────────────────────────────
# Repo-local self-management Kustomization for dev and verify clusters.
#
# Applied by .mise/cluster/install-component.sh and dev:update after Flux's
# CRDs are Established and controllers are Available. From then on Flux
# reconciles its own install from the local k3d registry's OCI artifact.
#
# This manifest is a test/dev fixture for this repository, not part of the
# published package. Consuming clusters own their own OCIRepository and
# self-management Kustomization (see docs/user-guide.md).
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitops
  namespace: flux-system
  annotations:
    cur8s.io/docs: https://github.com/cur8s/gitops
    cur8s.io/upstream-source: https://github.com/fluxcd/flux2
spec:
  interval: 10m
  path: ./deploy
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: gitops
