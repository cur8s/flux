# ─────────────────────────────────────────────────────────────────────────────
# Deploy overlay — the opinionated Flux install.
#
# Input is the manifest generated by `flux install --export` (3 controllers).
# Structural composition only (RFC: Static Runtime Manifests) — no templating,
# no runtime decisions. fifo sort preserves upstream resource order so the
# Namespace and CRDs stay ahead of the workloads that depend on them.
#
# The ExternalArtifact feature gate (a patch on kustomize-controller) is added
# here once validated against the tracked Flux version; see src/flux/config/notes.md.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../artifacts/fetched/manifests/flux.yaml

# Enable the ExternalArtifact feature gate on kustomize-controller so the
# cluster can consume ExternalArtifact sources. Pure structural composition
# (an appended flag) — no runtime interpretation. Qualified by `make e2e`
# against the tracked Flux version (see config/notes.md). See RFC-015.
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: kustomize-controller
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --feature-gates=ExternalArtifact=true

sortOptions:
  order: fifo
