# ─────────────────────────────────────────────────────────────────────────────
# Deploy overlay — the opinionated Flux install.
#
# Input is the manifest generated by `flux install --export` (3 controllers).
# Structural composition only (RFC: Static Runtime Manifests) — no templating,
# no runtime decisions. fifo sort preserves upstream resource order so the
# Namespace and CRDs stay ahead of the workloads that depend on them.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../artifacts/fetched/manifests/flux.yaml

sortOptions:
  order: fifo
