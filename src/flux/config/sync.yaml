# ─────────────────────────────────────────────────────────────────────────────
# Self-management Kustomization.
#
# Applied once at bootstrap (after the controllers are running). From then on
# Flux continuously reconciles its OWN install from the published OCI artifact:
# bumping the artifact tag is how Flux upgrades itself.
#
# The OCIRepository named `flux` it sources from is environment-specific (dev =
# local k3d registry, prod = ghcr.io) and is applied alongside this file by
# `scripts/make/sync`. This file ships INSIDE the artifact (oci/flux/sync.yaml)
# so the artifact is self-describing.
# ─────────────────────────────────────────────────────────────────────────────
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy
  prune: true
  wait: true
  sourceRef:
    kind: OCIRepository
    name: flux
