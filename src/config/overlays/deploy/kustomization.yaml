# ─────────────────────────────────────────────────────────────────────────────
# Deploy overlay — the opinionated Flux install.
#
# Input is the manifest generated by `flux install --export` (3 controllers).
# Structural composition only (RFC: Static Runtime Manifests) — no templating,
# no runtime decisions. fifo sort preserves upstream resource order so the
# Namespace and CRDs stay ahead of the workloads that depend on them.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../upstream/flux.yaml

# Mark every object as cur8s-installed so the cluster answers
# "what did cur8s put here" with one selector:
#   kubectl get all -A -l cur8s.io/component=gitops
# Metadata only (no selectors, no pod templates) — upstream's own
# app.kubernetes.io/{instance,part-of,version} labels carry the rest.
labels:
  - pairs:
      cur8s.io/component: gitops

sortOptions:
  order: fifo
