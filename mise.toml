# Pinned toolchain for the artifact pipeline: mise installs exact
# versions so a fetch → render run reproduces byte-for-byte
# on any workstation and in CI. docker is the one deliberate outsider
# (the daemon belongs to the host); git, openssl, curl, and jq ride the
# system. UPSTREAM_VERSION and CUR8S_REVISION in [env] are the release
# unit's single authored version source; the Flux pin follows
# UPSTREAM_VERSION. mise.lock pins each tool's download checksums.
#
# Task grammar: <object>:<action>. Objects:
#   upstream  the tracked upstream release: fetch captures it unmodified
#             in upstream/flux.yaml; check reports newer ones.
#   build     the reviewable artifact tree: clean deletes generated
#             output in artifacts/; render cleans, then regenerates artifacts/rendered/
#             from the captured inputs, never fetching.
#   dev       your local dev environment (always targets the dev cluster):
#             create renders and spins up cluster + Flux + local OCI sync;
#             update renders, publishes to dev's local registry, and
#             reconciles Flux; status, reconcile, watch, and delete inspect,
#             operate, and remove it.
#   verify    the automated release-readiness gate (owns the verify cluster):
#             verify:run proves the committed tree matches a fresh fetch +
#             render, then runs the end-to-end cluster check via .mise/env.sh,
#             deleting the cluster on pass and keeping it on failure;
#             verify:clean removes a kept one.
#   release   explicit remote publication: release:publish pushes
#             artifacts/rendered/ to REGISTRY via .mise/oci-push.sh.
# Clusters: a repo has two local k3d clusters, dev and verify, named
# CUR8S_COMPONENT-dev and CUR8S_COMPONENT-verify, each with its own local
# OCI registry. .mise/cluster.sh (identical across component repos) creates,
# deletes, and inspects them; .mise/oci-push.sh (identical across component
# repos) is the single choke point for pushing OCI artifacts with cur8s.io/*
# annotations; .mise/env.sh (component-specific) boots Flux and wires up
# reconciliation on either cluster. dev:* tasks always target dev; verify:*
# tasks own verify. Contexts live only in the repo-local KUBECONFIG, so no
# task reaches a cluster this repo did not create.
# artifacts/rendered/ is committed for review. artifacts/oci/ is reserved
# for future local OCI packaging and ignored; no packaging task exists yet.
# Captured inputs and authored configuration live in upstream/ and src/.
# Only upstream:fetch, build:render, dev:update, and .mise/env.sh are specific
# to this component; the rest are meant to be identical across cur8s component
# repos.
#
# Every task is an executable shell script under .mise/tasks/
# (directories namespace the names: .mise/tasks/upstream/fetch ->
# upstream:fetch). Supporting files (k3d-config.yaml, any shared
# scripts such as cluster.sh, env.sh, and oci-push.sh) live elsewhere under
# .mise/ so they never become tasks. Tasks run from the repo root and declare
# arguments in #USAGE headers, so `mise run <task> --help` documents them.

[settings]
# mise.lock records each tool's download URL and checksum per platform;
# installs fail if a download does not match. Refresh after changing a
# pin with: mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
lockfile = true
# A tool or platform missing from mise.lock is an install error, not a
# silent unverified download — so a pin bumped without re-locking fails to install.
locked = true

[tools]
flux2 = "{{env.UPSTREAM_VERSION}}"
kustomize = "5.8.1"
kubectl = "1.36.2"
k3d = "5.9.0"

[env]
# The package version: the upstream version, plus a config revision
# bumped when the opinion changes on the same upstream (reset to 1 on
# every upstream bump). 2.9.0 + 1 -> v2.9.0; 2.9.0 + 2 -> v2.9.0-2.
UPSTREAM_VERSION = "2.9.0"
CUR8S_REVISION = "1"
# Derived, with validation: a malformed value stops every mise command.
UPSTREAM_TAG = '{% if env.UPSTREAM_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="UPSTREAM_VERSION must be a stable SemVer (for example 2.9.0)") }}{% endif %}v{{ env.UPSTREAM_VERSION }}'
CUR8S_VERSION = '{% if env.CUR8S_REVISION is not matching(pat="^[1-9][0-9]*$") %}{{ throw(message="CUR8S_REVISION must be a positive integer") }}{% endif %}{{ env.UPSTREAM_TAG }}{% if env.CUR8S_REVISION != "1" %}-{{ env.CUR8S_REVISION }}{% endif %}'
# Component identity facts — the single authoring point for
# self-description (docs/architecture/02-artifact-contents-and-metadata.md).
# build:render writes them
# into the cur8s.yaml descriptor; .mise/oci-push.sh attaches them as
# cur8s.io/* OCI annotations.
CUR8S_COMPONENT = "flux"
CUR8S_UPSTREAM_PROJECT = "fluxcd/flux2"
CUR8S_SOURCE = "https://github.com/cur8s/flux"
CUR8S_DOCS = "https://github.com/cur8s/flux"
# Production registry (release:publish targets this registry; dev and
# verify pushes go to the k3d cluster's local registry via .mise/oci-push.sh).
REGISTRY = "ghcr.io/cur8s"
# Repo-local, git-ignored kubeconfig: k3d writes this repo's clusters
# here, and kubectl and flux read only it, so no task can reach a
# cluster this repo did not create.
KUBECONFIG = "{{config_root}}/.kube/config"
