# Pinned Kubernetes/pipeline toolchain for byte-for-byte reproducible renders
# and isolated local k3d clusters. System prerequisites (docker, git, bash,
# curl, openssl, jq) ride the host; mise.lock pins tool download checksums.
#
# Tasks live as executable scripts under .mise/tasks/<namespace>/<action>
# (run `mise tasks` to list them). Supporting helpers and config live under
# .mise/cluster/ so they are never discovered as tasks; see .mise/README.md.

[settings]
# mise.lock records each tool's download URL and checksum per platform;
# installs fail if a download does not match. Refresh after changing a
# pin with: mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
lockfile = true
# A tool or platform missing from mise.lock is an install error, not a
# silent unverified download — so a pin bumped without re-locking fails to install.
locked = true

[tools]
flux2 = "2.9.0"
kustomize = "5.8.1"
kubectl = "1.36.6"
k3d = "5.9.0"
shellcheck = "0.11.0"

[env]
# Upstream project and version (provenance metadata; independent of CUR8S_VERSION).
UPSTREAM_PROJECT = "fluxcd/flux2"
UPSTREAM_VERSION = "2.9.0"

# Independent SemVer for this Cur8s package (MAJOR.MINOR.PATCH).
CUR8S_VERSION = "0.1.0"

# Latest reviewed GA patch of the tested Kubernetes GA N-1 minor (within the
# pinned Flux release's support range); keep [tools].kubectl equal.
KUBERNETES_VERSION = "1.36.6"

# Component metadata written into cur8s.yaml by build:render and attached
# as cur8s.io/* OCI annotations by .mise/cluster/push-artifact.sh.
CUR8S_COMPONENT = "gitops"
CUR8S_SOURCE = "https://github.com/cur8s/gitops"
CUR8S_DOCS = "https://github.com/cur8s/gitops"

# Production release registry (release:publish targets this registry; dev and
# verify pushes go to the k3d cluster's local registry via .mise/cluster/push-artifact.sh).
RELEASE_REGISTRY = "ghcr.io/cur8s"

# Manifests applied by install-component.sh and dev:update:
# - FLUX_BOOTSTRAP_MANIFEST: installs the Flux controllers into a fresh cluster.
# - FLUX_SYNC_MANIFESTS: file or directory of Flux manifests (e.g. Kustomizations) applied after bootstrap.
FLUX_BOOTSTRAP_MANIFEST = "artifacts/rendered/deploy/flux.yaml"
FLUX_SYNC_MANIFESTS = "test/sync.yaml"


# ------------------------------------------------------------------------------
# Derived environment variables
#
# Computed from the authored inputs above or from mise's config_root. Version
# templates validate their inputs with throw(...) so a malformed value stops
# every mise command immediately. Do not edit these directly unless changing
# the derivation format (for example, the k3s packaging revision suffix).
# ------------------------------------------------------------------------------

UPSTREAM_TAG = '{% if env.UPSTREAM_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="UPSTREAM_VERSION must be a stable SemVer (for example 2.9.0)") }}{% endif %}v{{ env.UPSTREAM_VERSION }}'
CUR8S_TAG = '{% if env.CUR8S_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="CUR8S_VERSION must be a stable SemVer (for example 0.1.0)") }}{% endif %}{{ env.CUR8S_VERSION }}'
# `k3s1` is the k3s packaging revision, not a second Kubernetes version.
K3S_IMAGE = '{% if env.KUBERNETES_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="KUBERNETES_VERSION must be a stable SemVer (for example 1.36.6)") }}{% endif %}rancher/k3s:v{{ env.KUBERNETES_VERSION }}-k3s1'

# Repo-local, git-ignored kubeconfig: k3d writes this repo's clusters
# here, and kubectl and flux read only it, so no task can reach a
# cluster this repo did not create.
KUBECONFIG = "{{config_root}}/.kube/config"
