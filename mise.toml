# Pinned toolchain for the artifact pipeline: mise installs exact
# versions so a fetch → render run reproduces byte-for-byte
# on any workstation and in CI. docker is the one deliberate outsider
# (the daemon belongs to the host); git, openssl, curl, and jq ride the
# system. FLUX_VERSION and CUR8S_FLUX_REVISION in [env] are the release
# unit's single authored version source; the Flux pin follows
# FLUX_VERSION. mise.lock pins each tool's download checksums.
#
# Task grammar: <object>:<action>. Objects:
#   upstream  the tracked upstream release: fetch captures it unmodified
#             in upstream/flux.yaml; check reports newer ones.
#   build     the reviewable artifact tree: clean deletes generated
#             output in artifacts/; render cleans, then regenerates artifacts/rendered/
#             from the captured inputs, never fetching.
#   cluster   pure k3d lifecycle: a cluster and its local OCI registry,
#             nothing installed on it. Names must start with
#             CUR8S_COMPONENT-, and contexts live only in the repo-local
#             KUBECONFIG, so no task reaches a cluster this repo did not
#             create.
#   flux      Flux on a cluster: boot installs it (here from the local
#             render; in other component repos from the published Flux
#             release), status and watch show it, reconcile forces this
#             component's Kustomization.
#   dev       the local development environment, composed from the
#             tasks above: create runs cluster:create -> flux:boot ->
#             oci:publish to the local registry -> hand Flux its own
#             artifact -> wait Ready.
#   test      the product contract: test:run proves the committed tree
#             matches a fresh fetch + render, then runs dev:create on an
#             ephemeral cluster, deleting it on success and keeping it on
#             failure; test:destroy deletes a kept one.
#   oci       oci:publish is the single choke point through which every
#             artifact leaves the repo: REGISTRY by default, or a
#             cluster's local registry with --cluster.
# artifacts/rendered/ is committed for review. artifacts/oci/ is reserved
# for future local OCI packaging and ignored; no packaging task exists yet.
# Captured inputs and authored configuration live in upstream/ and src/.
# Only upstream:fetch, build:render, and flux:boot are specific to this
# component; the rest are meant to be identical across cur8s component
# repos.
#
# Every task is an executable shell script under .mise/tasks/
# (directories namespace the names: .mise/tasks/upstream/fetch ->
# upstream:fetch). Supporting files (k3d-config.yaml, any shared
# scripts) live elsewhere under .mise/ so they never become tasks. Tasks
# run from the repo root and declare arguments in #USAGE headers, so
# `mise run <task> --help` documents them.

[settings]
# mise.lock records each tool's download URL and checksum per platform;
# installs fail if a download does not match. Refresh after changing a
# pin with: mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
lockfile = true
# A tool or platform missing from mise.lock is an install error, not a
# silent unverified download — so a pin bumped without re-locking fails to install.
locked = true

[tools]
flux2 = "{{env.FLUX_VERSION}}"
kustomize = "5.8.1"
kubectl = "1.36.2"
k3d = "5.9.0"

[env]
# The package version: the upstream Flux version, plus a config revision
# bumped when the opinion changes on the same upstream (reset to 1 on
# every upstream bump). 2.9.0 + 1 -> v2.9.0; 2.9.0 + 2 -> v2.9.0-2.
FLUX_VERSION = "2.9.0"
CUR8S_FLUX_REVISION = "1"
# Derived, with validation: a malformed value stops every mise command.
FLUX_TAG = '{% if env.FLUX_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="FLUX_VERSION must be a stable SemVer (for example 2.9.0)") }}{% endif %}v{{ env.FLUX_VERSION }}'
CUR8S_FLUX_VERSION = '{% if env.CUR8S_FLUX_REVISION is not matching(pat="^[1-9][0-9]*$") %}{{ throw(message="CUR8S_FLUX_REVISION must be a positive integer") }}{% endif %}{{ env.FLUX_TAG }}{% if env.CUR8S_FLUX_REVISION != "1" %}-{{ env.CUR8S_FLUX_REVISION }}{% endif %}'
# Component identity facts — the single authoring point for
# self-description (docs/architecture/02-artifact-contents-and-metadata.md).
# build:render writes them
# into the cur8s.yaml descriptor; oci:publish attaches them as
# cur8s.io/* OCI annotations.
CUR8S_COMPONENT = "flux"
CUR8S_UPSTREAM_PROJECT = "fluxcd/flux2"
CUR8S_SOURCE = "https://github.com/cur8s/flux"
CUR8S_DOCS = "https://github.com/cur8s/flux"
# Production registry (oci:publish publishes here by default; dev and
# test pushes go to the k3d cluster's local registry).
REGISTRY = "ghcr.io/cur8s"
# Default dev cluster for the cluster, flux, and dev tasks. Every
# cluster name must start with CUR8S_COMPONENT- (cluster:* refuse others).
CLUSTER_NAME = "flux-dev"
# Ephemeral cluster for test:run and test:destroy.
TEST_CLUSTER_NAME = "flux-e2e"
# Repo-local, git-ignored kubeconfig: k3d writes this repo's clusters
# here, and kubectl and flux read only it, so no task can reach a
# cluster this repo did not create.
KUBECONFIG = "{{config_root}}/.kube/config"
