# Pinned toolchain for the artifact pipeline: mise installs exact
# versions so a fetch → render run reproduces byte-for-byte
# on any workstation and in CI. docker is the one deliberate outsider
# (the daemon belongs to the host); git, openssl, curl, and jq ride the
# system. FLUX_VERSION and CUR8S_FLUX_REVISION in [env] are the release
# unit's single authored version source; the Flux pin follows
# FLUX_VERSION. mise.lock pins each tool's download checksums.
#
# Task grammar: <object>:<action>. Objects are artifact (the OCI
# artifact tree: src/ fetch + render -> committed oci/ -> push;
# artifact:push is the single choke point through which every artifact
# leaves the repo), cluster (a local k3d dev cluster, its local OCI
# registry, and what runs on it), test (the product contract: test:e2e
# proves the full bootstrap -> self-manage loop on an ephemeral cluster,
# test:drift proves the committed oci/ tree matches a fresh build),
# upstream (the tracked Flux release). release — the repo-level act of
# publishing the versioned artifact — takes no object segment.
#
# Every task is an executable shell script under .mise/tasks/
# (directories namespace the names: .mise/tasks/artifact/fetch ->
# artifact:fetch). Supporting files (k3d-config.yaml, any shared
# scripts) live elsewhere under .mise/ so they never become tasks. Tasks
# run from the repo root and declare arguments in #USAGE headers, so
# `mise run <task> --help` documents them.

[settings]
# mise.lock records each tool's download URL and checksum per platform;
# installs fail if a download does not match. Refresh after changing a
# pin with: mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
lockfile = true
# A tool or platform missing from mise.lock is an install error, not a
# silent unverified download — so a pin bumped without re-locking fails CI.
locked = true

[tools]
flux2 = "{{env.FLUX_VERSION}}"
kustomize = "5.8.1"
kubectl = "1.36.2"
k3d = "5.9.0"

[env]
# The package version: the upstream Flux version, plus a config revision
# bumped when the opinion changes on the same upstream (reset to 1 on
# every upstream bump). 2.9.0 + 1 -> v2.9.0; 2.9.0 + 2 -> v2.9.0-2.
FLUX_VERSION = "2.9.0"
CUR8S_FLUX_REVISION = "1"
# Derived, with validation: a malformed value stops every mise command.
FLUX_TAG = '{% if env.FLUX_VERSION is not matching(pat="^[0-9]+[.][0-9]+[.][0-9]+$") %}{{ throw(message="FLUX_VERSION must be a stable SemVer (for example 2.9.0)") }}{% endif %}v{{ env.FLUX_VERSION }}'
CUR8S_FLUX_VERSION = '{% if env.CUR8S_FLUX_REVISION is not matching(pat="^[1-9][0-9]*$") %}{{ throw(message="CUR8S_FLUX_REVISION must be a positive integer") }}{% endif %}{{ env.FLUX_TAG }}{% if env.CUR8S_FLUX_REVISION != "1" %}-{{ env.CUR8S_FLUX_REVISION }}{% endif %}'
# Component identity facts — the single authoring point for
# self-description (docs/architecture.md). artifact:render writes them
# into the cur8s.yaml descriptor; artifact:push attaches them as
# cur8s.io/* OCI annotations.
CUR8S_COMPONENT = "flux"
CUR8S_UPSTREAM_PROJECT = "fluxcd/flux2"
CUR8S_SOURCE = "https://github.com/cur8s/flux"
CUR8S_DOCS = "https://github.com/cur8s/flux"
# Production registry (release publishes here; dev pushes go to the
# k3d cluster's local registry).
REGISTRY = "ghcr.io/cur8s"
# Default dev cluster; every cluster task also accepts a name argument.
CLUSTER_NAME = "flux-dev"
