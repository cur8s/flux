# Pinned Kubernetes/pipeline toolchain for byte-for-byte reproducible renders
# and isolated local k3d clusters. System prerequisites (docker, git, bash,
# curl, openssl, jq) ride the host; mise.lock pins tool download checksums.
#
# Tasks live as executable scripts under .mise/tasks/<namespace>/<action>
# (run `mise tasks` to list them). Supporting helpers and config live under
# .mise/cluster/ so they are never discovered as tasks; see .mise/README.md.

[settings]
# mise.lock records each tool's download URL and checksum per platform;
# installs fail if a download does not match. Refresh after changing a
# pin with: mise lock --platform linux-x64,linux-arm64,macos-x64,macos-arm64
lockfile = true
# A tool or platform missing from mise.lock is an install error, not a
# silent unverified download — so a pin bumped without re-locking fails to install.
locked = true

[tools]
flux2 = "2.9.0"
kustomize = "5.8.1"
kubectl = "1.36.6"
k3d = "5.9.0"
shellcheck = "0.11.0"

[env]
# Cur8s organization-wide OCI registry targeted by release:publish (dev and
# verify push to the k3d cluster's local registry via .mise/cluster/push-artifact.sh).
CUR8S_REGISTRY = "ghcr.io/cur8s"

# Component package identity and independent SemVer (MAJOR.MINOR.PATCH), written
# into cur8s.yaml by build:render and attached as cur8s.io/* OCI annotations.
COMPONENT_NAME = "gitops"
COMPONENT_VERSION = "0.1.0"
COMPONENT_SOURCE = "https://github.com/cur8s/gitops"
COMPONENT_DOCS = "https://github.com/cur8s/gitops"

# Upstream repository URL and release version (provenance metadata; independent
# of COMPONENT_VERSION). Keep [tools].flux2 equal to UPSTREAM_VERSION.
UPSTREAM_SOURCE = "https://github.com/fluxcd/flux2"
UPSTREAM_VERSION = "2.9.0"

# Local k3d cluster runtime and manifests used by dev and verify tasks:
# - KUBERNETES_VERSION: latest reviewed GA patch of the tested Kubernetes GA N-1
#   minor (within the pinned Flux release's support range); keep [tools].kubectl equal.
# - FLUX_BOOTSTRAP_MANIFEST: installs the Flux controllers into a fresh cluster.
# - FLUX_SYNC_PATH: repo file or directory of Flux manifests applied after bootstrap.
KUBERNETES_VERSION = "1.36.6"
FLUX_BOOTSTRAP_MANIFEST = "artifacts/rendered/deploy/flux.yaml"
FLUX_SYNC_PATH = "test/sync.yaml"


# ------------------------------------------------------------------------------
# Derived environment variables
#
# Computed from the authored inputs above or from mise's config_root. Do not
# edit these directly unless changing the derivation format (for example, the
# k3s packaging revision suffix).
# ------------------------------------------------------------------------------

UPSTREAM_TAG = "v{{ env.UPSTREAM_VERSION }}"
# `k3s1` is the k3s packaging revision, not a second Kubernetes version.
K3S_IMAGE = "rancher/k3s:v{{ env.KUBERNETES_VERSION }}-k3s1"

# Repo-local, git-ignored kubeconfig: k3d writes this repo's clusters
# here, and kubectl and flux read only it, so no task can reach a
# cluster this repo did not create.
KUBECONFIG = "{{config_root}}/.kube/config"
