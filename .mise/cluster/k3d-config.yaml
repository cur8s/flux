# Local k3d cluster template.
# Single server, no agents, Traefik disabled, and no host ports mapped so
# local clusters coexist without port conflicts.
apiVersion: k3d.io/v1alpha5
kind: Simple
servers: 1
agents: 0
options:
  k3d:
    wait: true
    timeout: "60s"
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:0
  kubeconfig:
    updateDefaultKubeconfig: true
    switchCurrentContext: false
